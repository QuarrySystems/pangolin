name: typecheck

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      # Cross-package type resolution reads each package's emitted
      # dist/index.d.ts (types: dist/index.d.ts), so build before typechecking.
      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      # Type-checks test/ as well as src/. `pnpm -r` runs this only in packages
      # that define the script, so it currently covers the six whose test/ is
      # already clean; the other ten are tracked in issue #99. Adding a
      # tsconfig.test.json + typecheck:test to a package opts it in — no change
      # needed here.
      - name: Typecheck tests
        run: pnpm -r typecheck:test
